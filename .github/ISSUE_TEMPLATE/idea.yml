name: An idea
description: Something the board could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What would you like the board to do, and what would it help you with?
    validations:
      required: true
  - type: textarea
    id: now
    attributes:
      label: How you do it today
      description: If you work around it now, how?
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Sketches, screenshots, links.
