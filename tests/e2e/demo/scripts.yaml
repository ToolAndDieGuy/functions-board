# The demo function "Away mode", added to the test config for the README screenshots and the demo video
# (tests/e2e/setup.sh demo). Demo entities only: no real names, places or devices.
secure_house:
  alias: Secure the house
  icon: mdi:shield-home
  sequence:
  - action: lock.lock
    target:
      entity_id:
      - lock.front_door
      - lock.kitchen_door
  - action: script.close_garage
  - action: light.turn_off
    target:
      entity_id:
      - light.kitchen_lights
      - light.ceiling_lights
      - light.living_room_rgbww_lights
      - light.office_rgbw_lights
  - action: climate.set_temperature
    target:
      entity_id: climate.heatpump
    data:
      temperature: 62
  - action: alarm_control_panel.alarm_arm_away
    target:
      entity_id: alarm_control_panel.security
    data:
      code: '1234'
welcome_home:
  alias: Welcome home
  icon: mdi:home-heart
  sequence:
  - action: alarm_control_panel.alarm_disarm
    target:
      entity_id: alarm_control_panel.security
    data:
      code: '1234'
  - action: climate.set_temperature
    target:
      entity_id: climate.heatpump
    data:
      temperature: 68
  - if:
    - condition: state
      entity_id: sun.sun
      state: below_horizon
    then:
    - action: light.turn_on
      target:
        entity_id: light.entrance_color_white_lights
